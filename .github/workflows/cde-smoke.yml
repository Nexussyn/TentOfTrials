name: CDE smoke test
on:
  pull_request:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/cde-smoke.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Static browser self-test
        run: |
          set -e
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/cde-http.log 2>&1 &
          if command -v google-chrome >/dev/null 2>&1; then BROWSER=google-chrome; elif command -v chromium >/dev/null 2>&1; then BROWSER=chromium; elif command -v chromium-browser >/dev/null 2>&1; then BROWSER=chromium-browser; else echo "No Chromium/Chrome" >&2; exit 1; fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom --virtual-time-budget=8000 'http://127.0.0.1:4173/index.html?selftest=1' >/tmp/cde-selftest.html 2>/tmp/cde-browser.log
          python3 - <<'PY'
          import re,sys
          s=open('/tmp/cde-selftest.html',encoding='utf-8').read()
          if 'CDE SELFTEST PASS' not in s: raise SystemExit('SELFTEST PASS missing')
          if 'Crypto Direction Engine — V13.0' not in s: raise SystemExit('V13.0 title missing')
          print('SELFTEST OK')
          m=re.search(r'<b id="kPrice">(.*?)</b>',s,re.S); print('kPrice=',m.group(1) if m else 'missing')
          PY
      - name: Live API smoke
        run: |
          python3 -m pip install --quiet requests websocket-client
          python3 - <<'PY'
          import json,time,requests,websocket
          # Hyperliquid Info + candle endpoint
          h='https://api.hyperliquid.xyz/info'
          r=requests.post(h,json={'type':'metaAndAssetCtxs'},timeout=10)
          r.raise_for_status()
          data=r.json()
          assert data and data[0].get('universe'), 'Hyperliquid meta empty'
          r=requests.post(h,json={'type':'candleSnapshot','req':{'coin':'BTC','interval':'1m','startTime':int(time.time()*1000)-3600000,'endTime':int(time.time()*1000)}},timeout=10)
          r.raise_for_status(); assert len(r.json())>10,'Hyperliquid candles empty'
          # Binance futures + spot
          r=requests.get('https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT',timeout=10);r.raise_for_status()
          r=requests.get('https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT',timeout=10);r.raise_for_status()
          r=requests.get('https://api.binance.com/api/v3/aggTrades?symbol=BTCUSDT&limit=5',timeout=10);r.raise_for_status()
          # Hyperliquid WS
          ws=websocket.create_connection('wss://api.hyperliquid.xyz/ws',timeout=8)
          ws.send(json.dumps({'method':'subscribe','subscription':{'type':'allMids'}}))
          deadline=time.time()+8; got=False
          while time.time()<deadline:
              msg=json.loads(ws.recv())
              if msg.get('channel')=='allMids' and msg.get('data',{}).get('mids',{}).get('BTC') is not None:
                  got=True;break
          ws.close(); assert got,'Hyperliquid allMids not received'
          # Binance combined WS
          ws=websocket.create_connection('wss://fstream.binance.com/stream?streams=btcusdt@aggTrade',timeout=8)
          deadline=time.time()+8;got=False
          while time.time()<deadline:
              msg=json.loads(ws.recv()); d=msg.get('data',{})
              if (msg.get('stream','').endswith('@aggTrade') and d.get('s')=='BTCUSDT'):
                  got=True;break
          ws.close(); assert got,'Binance aggTrade not received'
          print('LIVE API + WS OK')
          PY
      - name: Live browser smoke
        run: |
          if command -v google-chrome >/dev/null 2>&1; then BROWSER=google-chrome; elif command -v chromium >/dev/null 2>&1; then BROWSER=chromium; else BROWSER=chromium-browser; fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom --virtual-time-budget=15000 'http://127.0.0.1:4173/index.html?live-smoke=1' >/tmp/cde-live.html 2>/tmp/cde-live-browser.log
          python3 - <<'PY'
          import re,sys
          s=open('/tmp/cde-live.html',encoding='utf-8').read()
          if 'Crypto Direction Engine — V13.0' not in s: raise SystemExit('V13 title missing')
          d=re.search(r'<div id="dir"[^>]*>(.*?)</div>',s,re.S)
          p=re.search(r'<b id="kPrice">(.*?)</b>',s,re.S)
          h=re.search(r'<div id="health"[^>]*>(.*?)</div>',s,re.S)
          print('dir=',re.sub('<.*?>','',d.group(1)).strip() if d else 'missing')
          print('price=',re.sub('<.*?>','',p.group(1)).strip() if p else 'missing')
          print('health_len=',len(h.group(1)) if h else 0)
          if not p or re.sub('<.*?>','',p.group(1)).strip() in ('','—'): raise SystemExit('LIVE price not populated in browser')
          if not d or 'CHARGEMENT' in d.group(1): raise SystemExit('browser remained in CHARGEMENT')
          if not h or len(h.group(1))<50: raise SystemExit('health not rendered')
          print('LIVE BROWSER OK')
          PY
